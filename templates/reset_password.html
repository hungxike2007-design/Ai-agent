<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu — AI Agent Analytics</title>
    <meta name="description" content="Tạo mật khẩu mới cho tài khoản AI Agent Analytics">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS (local) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth_utils.css') }}?v=1.0">
</head>

<body>
    <canvas id="particle-canvas"></canvas>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="auth-card text-center w-100 p-4 p-md-5" style="max-width: 440px;">
            <div class="shield-wrap">
                <div class="rings">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ring"></div>
                </div>
                <div class="shield-icon"><i class="fas fa-shield-halved"></i></div>
            </div>

            <h1 class="h4 font-weight-bold mb-2" style="color: var(--text); letter-spacing: -0.03em;">Đặt lại mật khẩu</h1>
            <p class="mb-4" style="color: var(--muted); font-size: 0.9rem; font-weight: 500; line-height: 1.6;">Tạo mật khẩu mới cho <strong style="color: var(--text);">{{ email }}</strong></p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for cat, msg in messages %}
            <div class="flash {{ cat }} d-flex align-items-center" style="gap: 8px; text-align: left;">
                <i class="fas fa-{% if cat == 'success' %}check-circle{% else %}exclamation-circle{% endif %}"></i>
                {{ msg }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.reset_password', email=email) }}" method="POST">
                <div class="input-wrap mb-3" style="text-align: left;">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="new-password" name="password" class="form-control" placeholder="Mật khẩu mới" required oninput="checkStrength(this.value)">
                    <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                </div>
                <div class="input-wrap mb-3" style="text-align: left;">
                    <i class="fas fa-lock-open input-icon"></i>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Xác nhận mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-purple d-flex align-items-center justify-content-center" style="gap: 8px;">
                    <i class="fas fa-check-circle"></i> Xác nhận đổi mật khẩu
                </button>
            </form>

            <a href="{{ url_for('auth.index') }}" class="back-link d-inline-flex align-items-center mt-4" style="gap: 6px;">
                <i class="fas fa-arrow-left"></i> Quay lại đăng nhập
            </a>
        </div>
    </div>

    <!-- Bootstrap JS (local) -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

    <script src="{{ url_for('static', filename='js/auth_utils.js') }}?v=1.0"></script>
</body>

</html>
